name: Linux native geometry
on:
  push:
    branches: ['rc/0.3.20260905']
    paths: ['native/**', 'core/**', 'adapters/**', 'tools/cloud/**', 'tests/**', '.github/workflows/linux-geometry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang libomp-dev libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 xvfb
      - run: python tools/cloud/geometry_setup.py
      - run: .artifacts/blender-5.0.1-linux-x64/blender -b --factory-startup --python-exit-code 1 --python tools/cloud/geometry_tests.py
